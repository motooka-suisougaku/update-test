<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎺 リード在庫管理v1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --accent-light: #f39c12;
            --success: #27ae60;
            --bg: #ecf0f1;
            --card: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #bdc3c7;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin: 16px;
        }

        /* ===== スクリーン管理 ===== */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ヘッダー ===== */
        .header {
            background: linear-gradient(135deg, var(--primary), #34495e);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== コンテンツエリア ===== */
        .content {
            padding: 32px 24px;
        }

        /* ===== ボタンスタイル ===== */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 12px 24px;
        }

        .btn {
            background: var(--accent);
            color: white;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn:active, .btn:hover {
            background: #c0392b;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary:active, .btn-secondary:hover {
            background: #1a252f;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:active, .btn-success:hover {
            background: #229954;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        /* ===== フォーム要素 ===== */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        /* ===== セキュリティコード画面 ===== */
        .code-input {
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        .code-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
        }

        /* ===== 楽器選択ボタン ===== */
        .instrument-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .instrument-btn {
            padding: 20px;
            font-size: 18px;
            background: var(--bg);
            color: var(--text);
            border: 3px solid var(--border);
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .instrument-btn:hover, .instrument-btn:active {
            border-color: var(--accent);
            background: #fff9f5;
            transform: scale(1.05);
        }

        /* ===== 大きなプラスマイナスボタン ===== */
        .quantity-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin: 40px 0;
        }

        .qty-btn {
            width: 80px;
            height: 80px;
            font-size: 48px;
            border-radius: 16px;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
            active: {
                transform: scale(0.95);
            }
        }

        .qty-btn:active {
            transform: scale(0.95);
        }

        .qty-display {
            text-align: center;
        }

        .qty-number {
            font-size: 64px;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
        }

        .qty-label {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 8px;
        }

        /* ===== ウェルカムメッセージ ===== */
        .welcome-message {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 24px;
        }

        .welcome-message h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .welcome-message p {
            font-size: 14px;
            opacity: 0.95;
        }

        /* ===== リード選択カード ===== */
        .reed-card {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reed-card.selected {
            background: #fff9f5;
            border-left-color: var(--success);
        }

        .reed-card:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .reed-card-name {
            font-weight: 600;
            color: var(--text);
        }

        .reed-card-info {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ===== チェックボックス ===== */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* ===== 待機中の人リスト ===== */
        .pending-list {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .pending-list h3 {
            color: #856404;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .pending-item {
            background: white;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            color: #856404;
            font-size: 14px;
        }

        /* ===== 買い物リスト ===== */
        .shopping-list {
            margin-top: 24px;
        }

        .shopping-item {
            background: var(--bg);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent);
        }

        .shopping-item.warning {
            background: #ffe8e8;
            border-left-color: var(--accent);
        }

        .shopping-item.ok {
            background: #e8f5e9;
            border-left-color: var(--success);
        }

        .shopping-item-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .shopping-item-info {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .shopping-item-boxes {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
            margin-top: 8px;
        }

        /* ===== アラート ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* ===== モーダル/ポップアップ ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 28px;
            margin-bottom: 12px;
            color: var(--success);
        }

        .modal-content p {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        /* ===== テーブル ===== */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: var(--primary);
            color: white;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:hover {
            background: var(--bg);
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 600px) {
            .container {
                border-radius: 0;
                margin: 0;
                min-height: 100vh;
            }

            .content {
                padding: 24px 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .qty-number {
                font-size: 48px;
            }

            .qty-btn {
                width: 64px;
                height: 64px;
                font-size: 36px;
            }

            .instrument-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* ===== ローディング ===== */
        .spinner {
            border: 3px solid var(--bg);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-button {
            background: var(--text-light);
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .back-button:hover, .back-button:active {
            background: var(--text);
        }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== Screen 1: セキュリティコード入力 ===== -->
        <div id="screen-security" class="screen active">
            <div class="header">
                <h1>🎺 リード在庫管理</h1>
                <p class="subtitle">吹奏楽部</p>
            </div>
            <div class="content">
                <div class="form-group">
                    <label>セキュリティコードを入力</label>
                    <input type="text" id="securityCode" class="code-input" placeholder="例: ONGAKUDO" maxlength="10">
                    <p class="code-hint">学校から指定されたコードを入力してください</p>
                </div>
                <button class="btn" onclick="verifySecurity()">進む</button>
            </div>
        </div>

        <!-- ===== Screen 2: 楽器選択 ===== -->
        <div id="screen-instrument" class="screen">
            <div class="header">
                <h1>🎺 楽器を選択</h1>
                <p class="subtitle">あなたの楽器は？</p>
            </div>
            <div class="content">
                <div class="instrument-buttons">
                    <button class="instrument-btn" onclick="selectInstrument('Saxophone')">🎷 サックス</button>
                    <button class="instrument-btn" onclick="selectInstrument('Clarinet')">🎺 クラリネット</button>
                    <button class="instrument-btn" onclick="selectInstrument('Trumpet')">🎺 トランペット</button>
                    <button class="instrument-btn" onclick="selectInstrument('Horn')">🎺 ホルン</button>
                    <button class="instrument-btn" onclick="selectInstrument('Trombone')">🎺 トロンボーン</button>
                    <button class="instrument-btn" onclick="selectInstrument('Tuba')">🎺 チューバ</button>
                </div>
            </div>
        </div>

        <!-- ===== Screen 3: 新規登録またはログイン ===== -->
        <div id="screen-register-or-login" class="screen">
            <div class="header">
                <h1 id="registerOrLoginTitle">ログイン</h1>
                <p class="subtitle" id="registerOrLoginSubtitle"></p>
            </div>
            <div class="content">
                <button class="back-button" onclick="goBack('instrument')">＜ 戻る</button>

                <!-- ログイン画面 -->
                <div id="login-section">
                    <div class="form-group">
                        <label>あなたの名前を選択</label>
                        <select id="memberSelect">
                            <option value="">-- 選択してください --</option>
                        </select>
                    </div>
                    <button class="btn" onclick="loginMember()">ログイン</button>
                    <p style="text-align: center; margin-top: 16px; color: var(--text-light); font-size: 13px;">
                        初めての方は下へ ↓
                    </p>
                </div>

                <!-- 新規登録に切り替えボタン -->
                <button class="btn-secondary btn-small" onclick="toggleRegisterForm()" style="width: 100%; margin-top: 16px;">
                    新規登録 →
                </button>

                <!-- 新規登録フォーム（非表示） -->
                <div id="register-section" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--border);">
                    <div class="form-group">
                        <label>新しい名前を入力</label>
                        <input type="text" id="newMemberName" placeholder="例: 田中太郎">
                    </div>
                    <button class="btn-success" onclick="registerNewMember()">新規登録</button>
                    <button class="btn-secondary btn-small" onclick="toggleRegisterForm()" style="width: 100%; margin-top: 12px;">
                        ← ログイン画面に戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== Screen 4: リード追加 ===== -->
        <div id="screen-add-reed" class="screen">
            <div class="header">
                <h1>🎵 リードを追加</h1>
                <p class="subtitle">新しいリード銘柄を登録</p>
            </div>
            <div class="content">
                <button class="back-button" onclick="goBack('dashboard')">＜ ダッシュボードへ</button>

                <div class="form-group">
                    <label>リード銘柄名</label>
                    <input type="text" id="reedName" placeholder="例: Vandoren B40">
                </div>

                <div class="form-group">
                    <label>1箱の入数（本数）</label>
                    <input type="number" id="reedBoxCount" placeholder="例: 10" min="1">
                </div>

                <button class="btn-success" onclick="addNewReed()">リードを追加</button>
            </div>
        </div>

        <!-- ===== Screen 5: ダッシュボード（部員用） ===== -->
        <div id="screen-dashboard" class="screen">
            <div class="header">
                <h1 id="dashboardName">ようこそ</h1>
                <p class="subtitle">リード在庫管理</p>
            </div>
            <div class="content">
                <div class="welcome-message">
                    <h2 id="welcomeMessage">今日の入力</h2>
                    <p>リードの本数を更新してください</p>
                </div>

                <button class="btn-secondary btn-small" onclick="goToAddReed()" style="width: 100%; margin-bottom: 16px;">
                    + 新しいリードを追加
                </button>

                <div id="reedsList"></div>

                <button class="btn" onclick="logout()" style="margin-top: 24px;">ログアウト</button>
                <button class="btn-secondary btn-small" onclick="goToAdmin()" style="width: 100%;">
                    ⚙️ 管理画面へ
                </button>
            </div>
        </div>

        <!-- ===== Screen 6: 管理画面（集計・未入力者確認） ===== -->
        <div id="screen-admin" class="screen">
            <div class="header">
                <h1>⚙️ 管理画面</h1>
                <p class="subtitle">集計・在庫確認</p>
            </div>
            <div class="content">
                <button class="back-button" onclick="goBack('dashboard')">＜ ダッシュボードへ</button>

                <!-- タブ切り替え -->
                <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                    <button class="btn-secondary btn-small" style="flex: 1; background: var(--accent); color: white;" id="tab-shopping" onclick="switchTab('shopping')">
                        🛒 買い物リスト
                    </button>
                    <button class="btn-secondary btn-small" style="flex: 1;" id="tab-pending" onclick="switchTab('pending')">
                        👥 未入力者
                    </button>
                </div>

                <!-- 買い物リスト -->
                <div id="shopping-tab" class="shopping-list"></div>

                <!-- 未入力者リスト -->
                <div id="pending-tab" style="display: none;"></div>
            </div>
        </div>

        <!-- ===== 送信完了モーダル ===== -->
        <div id="successModal" class="modal">
            <div class="modal-content">
                <h2>✓ 完了！</h2>
                <p id="successMessage">入力が保存されました</p>
                <button class="btn-secondary" onclick="closeModal()">ダッシュボードに戻る</button>
            </div>
        </div>
    </div>

    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // ========================================
        // Firebase 設定
        // ========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA2mI7Cv1gIbUKwfuFKQkDj_QVx6WmiZfU",
            authDomain: "riidokanri.firebaseapp.com",
            projectId: "riidokanri",
            storageBucket: "riidokanri.firebasestorage.app",
            messagingSenderId: "437505590526",
            appId: "1:437505590526:web:463ca03512bdca988a11af"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ========================================
        // グローバル変数
        // ========================================
        let currentScreen = 'security';
        let securityCode = 'ONGAKUDO'; // デフォルト
        let selectedInstrument = null;
        let currentMemberId = null;
        let currentMemberName = null;
        let currentReeds = {};
        let allMembers = [];
        let allReeds = {};

        // ========================================
        // スクリーン管理
        // ========================================
        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenName}`).classList.add('active');
            currentScreen = screenName;

            // 画面ごとの処理
            if (screenName === 'register-or-login') {
                loadMembers();
            } else if (screenName === 'dashboard') {
                loadDashboard();
            } else if (screenName === 'admin') {
                loadAdmin();
            }
        }

        function goBack(screenName) {
            showScreen(screenName);
        }

        // ========================================
        // Screen 1: セキュリティコード
        // ========================================
        function verifySecurity() {
            const code = document.getElementById('securityCode').value.trim().toUpperCase();
            
            if (!code) {
                alert('コードを入力してください');
                return;
            }

            if (code === securityCode) {
                showScreen('instrument');
            } else {
                alert('コードが正しくありません');
            }
        }

        // ========================================
        // Screen 2: 楽器選択
        // ========================================
        function selectInstrument(instrument) {
            selectedInstrument = instrument;
            document.getElementById('registerOrLoginSubtitle').textContent = 
                `あなたの楽器: ${getInstrumentName(instrument)}`;
            showScreen('register-or-login');
        }

        function getInstrumentName(instrument) {
            const names = {
                'Saxophone': 'サックス',
                'Clarinet': 'クラリネット',
                'Trumpet': 'トランペット',
                'Horn': 'ホルン',
                'Trombone': 'トロンボーン',
                'Tuba': 'チューバ'
            };
            return names[instrument] || instrument;
        }

        // ========================================
        // Screen 3: ログイン・新規登録
        // ========================================
        async function loadMembers() {
            try {
                const snapshot = await db.collection('members')
                    .where('instrument', '==', selectedInstrument)
                    .get();

                const select = document.getElementById('memberSelect');
                select.innerHTML = '<option value="">-- 選択してください --</option>';

                allMembers = [];
                snapshot.forEach(doc => {
                    allMembers.push({ id: doc.id, ...doc.data() });
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = doc.data().name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('部員読み込みエラー:', error);
            }
        }

        function loginMember() {
            const select = document.getElementById('memberSelect');
            const memberId = select.value;

            if (!memberId) {
                alert('名前を選択してください');
                return;
            }

            currentMemberId = memberId;
            const member = allMembers.find(m => m.id === memberId);
            currentMemberName = member.name;

            showScreen('dashboard');
        }

        function toggleRegisterForm() {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');

            loginSection.style.display = loginSection.style.display === 'none' ? 'block' : 'none';
            registerSection.style.display = registerSection.style.display === 'none' ? 'block' : 'none';
        }

        async function registerNewMember() {
            const name = document.getElementById('newMemberName').value.trim();

            if (!name) {
                alert('名前を入力してください');
                return;
            }

            try {
                const docRef = await db.collection('members').add({
                    name: name,
                    instrument: selectedInstrument,
                    createdAt: new Date()
                });

                currentMemberId = docRef.id;
                currentMemberName = name;

                showScreen('dashboard');
            } catch (error) {
                console.error('登録エラー:', error);
                alert('登録に失敗しました');
            }
        }

        // ========================================
        // Screen 4: リード追加
        // ========================================
        function goToAddReed() {
            showScreen('add-reed');
        }

        async function addNewReed() {
            const reedName = document.getElementById('reedName').value.trim();
            const boxCount = parseInt(document.getElementById('reedBoxCount').value);

            if (!reedName || !boxCount || boxCount < 1) {
                alert('すべてのフィールドを入力してください');
                return;
            }

            try {
                const docRef = await db.collection('reeds').add({
                    name: reedName,
                    boxCount: boxCount,
                    instrument: selectedInstrument,
                    createdAt: new Date()
                });

                document.getElementById('reedName').value = '';
                document.getElementById('reedBoxCount').value = '';

                showSuccessModal(`「${reedName}」を追加しました！`);
                setTimeout(() => {
                    showScreen('dashboard');
                }, 1500);
            } catch (error) {
                console.error('リード追加エラー:', error);
                alert('追加に失敗しました');
            }
        }

        // ========================================
        // Screen 5: ダッシュボード
        // ========================================
        async function loadDashboard() {
            document.getElementById('dashboardName').textContent = 
                `${currentMemberName}さん、おはよう！`;

            try {
                // リードを読み込む
                const reedsSnapshot = await db.collection('reeds')
                    .where('instrument', '==', selectedInstrument)
                    .get();

                currentReeds = {};
                allReeds = {};

                reedsSnapshot.forEach(doc => {
                    allReeds[doc.id] = { id: doc.id, ...doc.data() };
                });

                // このメンバーの在庫を読み込む
                const stockSnapshot = await db.collection('member_stocks')
                    .where('memberId', '==', currentMemberId)
                    .get();

                stockSnapshot.forEach(doc => {
                    currentReeds[doc.data().reedId] = doc.data().quantity;
                });

                renderReedsList();
            } catch (error) {
                console.error('ダッシュボード読み込みエラー:', error);
            }
        }

        function renderReedsList() {
            const container = document.getElementById('reedsList');
            
            if (Object.keys(allReeds).length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 32px 0; color: var(--text-light);">
                        <p style="font-size: 14px;">まだリードが登録されていません</p>
                        <p style="font-size: 12px; margin-top: 8px;">「新しいリードを追加」から追加してください</p>
                    </div>
                `;
                return;
            }

            let html = '';

            Object.entries(allReeds).forEach(([reedId, reed]) => {
                const quantity = currentReeds[reedId] || 0;

                html += `
                    <div style="margin-bottom: 16px;">
                        <div class="reed-card" style="border: none; background: var(--primary); color: white; padding: 16px;">
                            <div style="font-weight: 700; font-size: 16px; margin-bottom: 12px;">
                                ${reed.name}
                            </div>
                            <div style="font-size: 13px; margin-bottom: 16px; opacity: 0.9;">
                                1箱: ${reed.boxCount}本入り
                            </div>

                            <div class="quantity-control" style="gap: 16px; margin: 0;">
                                <button class="qty-btn" onclick="decreaseReedQty('${reedId}')" style="width: 60px; height: 60px; font-size: 36px;">−</button>
                                <div class="qty-display">
                                    <div class="qty-number" style="color: white;">${quantity}</div>
                                    <div class="qty-label" style="color: rgba(255,255,255,0.8);">本</div>
                                </div>
                                <button class="qty-btn" onclick="increaseReedQty('${reedId}')" style="width: 60px; height: 60px; font-size: 36px;">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // 保存ボタンを追加
            container.innerHTML += `
                <button class="btn-success" onclick="saveReeds()" style="margin-top: 20px; font-size: 18px; padding: 16px;">
                    📝 これで完了！送信
                </button>
            `;
        }

        function increaseReedQty(reedId) {
            currentReeds[reedId] = (currentReeds[reedId] || 0) + 1;
            renderReedsList();
        }

        function decreaseReedQty(reedId) {
            const qty = currentReeds[reedId] || 0;
            if (qty > 0) {
                currentReeds[reedId] = qty - 1;
            }
            renderReedsList();
        }

        async function saveReeds() {
            try {
                const batch = db.batch();

                // 既存データを削除
                const existingDocs = await db.collection('member_stocks')
                    .where('memberId', '==', currentMemberId)
                    .get();

                existingDocs.forEach(doc => {
                    batch.delete(doc.ref);
                });

                // 新しいデータを保存
                Object.entries(currentReeds).forEach(([reedId, quantity]) => {
                    if (quantity > 0) {
                        const newDocRef = db.collection('member_stocks').doc();
                        batch.set(newDocRef, {
                            memberId: currentMemberId,
                            reedId: reedId,
                            quantity: quantity,
                            memberName: currentMemberName,
                            instrument: selectedInstrument,
                            updatedAt: new Date()
                        });
                    }
                });

                await batch.commit();

                showSuccessModal('お疲れ様でした！\nデータが保存されました');
                setTimeout(() => {
                    loadDashboard();
                }, 1500);
            } catch (error) {
                console.error('保存エラー:', error);
                alert('保存に失敗しました');
            }
        }

        // ========================================
        // Screen 6: 管理画面
        // ========================================
        async function loadAdmin() {
            try {
                const stockSnapshot = await db.collection('member_stocks')
                    .where('instrument', '==', selectedInstrument)
                    .get();

                const stocksByReed = {};
                const submittedMembers = new Set();

                stockSnapshot.forEach(doc => {
                    const data = doc.data();
                    submittedMembers.add(data.memberId);

                    if (!stocksByReed[data.reedId]) {
                        stocksByReed[data.reedId] = {
                            quantity: 0,
                            contributors: []
                        };
                    }

                    stocksByReed[data.reedId].quantity += data.quantity;
                    stocksByReed[data.reedId].contributors.push(data.memberName);
                });

                renderShoppingList(stocksByReed);
                renderPendingList(submittedMembers);
            } catch (error) {
                console.error('管理画面読み込みエラー:', error);
            }
        }

        function renderShoppingList(stocksByReed) {
            const container = document.getElementById('shopping-tab');
            
            if (Object.keys(allReeds).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-light);">リード情報を読み込み中...</p>';
                return;
            }

            let html = '';

            Object.entries(allReeds).forEach(([reedId, reed]) => {
                const stock = stocksByReed[reedId] || { quantity: 0, contributors: [] };
                const boxesNeeded = Math.ceil(stock.quantity / reed.boxCount);
                const shortageCount = boxesNeeded * reed.boxCount - stock.quantity;

                const statusClass = boxesNeeded > 0 ? 'warning' : 'ok';

                html += `
                    <div class="shopping-item ${statusClass}">
                        <div class="shopping-item-title">
                            ${reed.name}
                        </div>
                        <div class="shopping-item-info">
                            現在: <strong>${stock.quantity}本</strong> (${stock.contributors.length}人が入力)<br>
                            ${boxesNeeded > 0 ? `あと<strong>${shortageCount}本</strong>不足<br>` : ''}
                        </div>
                        <div class="shopping-item-boxes">
                            ${boxesNeeded}箱必要 (1箱${reed.boxCount}本)
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<p style="text-align: center;">リード情報がありません</p>';
        }

        async function renderPendingList(submittedMembers) {
            const container = document.getElementById('pending-tab');
            
            try {
                const membersSnapshot = await db.collection('members')
                    .where('instrument', '==', selectedInstrument)
                    .get();

                const allMembersInInstrument = [];
                const pendingMembers = [];

                membersSnapshot.forEach(doc => {
                    const name = doc.data().name;
                    allMembersInInstrument.push(name);

                    if (!submittedMembers.has(doc.id)) {
                        pendingMembers.push(name);
                    }
                });

                if (pendingMembers.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-success">
                            ✓ みんな入力完了！
                        </div>
                    `;
                } else {
                    let html = `
                        <div class="pending-list">
                            <h3>📝 まだ入力していない人</h3>
                    `;

                    pendingMembers.forEach(name => {
                        html += `<div class="pending-item">• ${name}</div>`;
                    });

                    html += `
                        </div>
                        <p style="text-align: center; margin-top: 16px; color: var(--text-light); font-size: 13px;">
                            全${allMembersInInstrument.length}人中、${submittedMembers.size}人が入力済み
                        </p>
                    `;

                    container.innerHTML = html;
                }
            } catch (error) {
                console.error('未入力者リスト読み込みエラー:', error);
            }
        }

        function switchTab(tabName) {
            document.getElementById('shopping-tab').style.display = tabName === 'shopping' ? 'block' : 'none';
            document.getElementById('pending-tab').style.display = tabName === 'pending' ? 'block' : 'none';

            document.getElementById('tab-shopping').style.background = 
                tabName === 'shopping' ? 'var(--accent)' : '';
            document.getElementById('tab-shopping').style.color = 
                tabName === 'shopping' ? 'white' : '';

            document.getElementById('tab-pending').style.background = 
                tabName === 'pending' ? 'var(--accent)' : '';
            document.getElementById('tab-pending').style.color = 
                tabName === 'pending' ? 'white' : '';
        }

        function goToAdmin() {
            showScreen('admin');
        }

        // ========================================
        // ログアウト・その他
        // ========================================
        function logout() {
            currentMemberId = null;
            currentMemberName = null;
            currentReeds = {};
            selectedInstrument = null;
            showScreen('instrument');
        }

        function showSuccessModal(message) {
            document.getElementById('successMessage').textContent = message;
            document.getElementById('successModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
        }

        // ========================================
        // 初期化
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('アプリ初期化完了');
        });
    </script>
</body>
</html>
